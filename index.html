
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0755a5">
<title>SSM Golden City - Volunteer QR Scanner</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef5ff;color:#082e67;font-family:Arial,sans-serif}
header{background:linear-gradient(135deg,#0755a5,#0878d8);color:#fff;text-align:center;padding:16px 10px;border-bottom:4px solid #ffd34d}
header strong{display:block;font-size:20px}
header span{font-size:13px}
main{max-width:none;width:100%;margin:0;padding:0}
.panel{min-height:calc(100dvh - 90px);border:0;border-radius:0;padding:8px;box-shadow:none}
#reader{width:100%;height:calc(100dvh - 230px);min-height:300px;background:#071b33;border-radius:6px;overflow:hidden}
#reader video{width:100%!important;height:100%!important;object-fit:cover}
.panel{background:#fff;border:1px solid #c7d9ef;border-radius:12px;padding:14px;box-shadow:0 2px 8px #cdd9e8}
.note{font-size:14px;line-height:1.5}
.actions{display:flex;gap:9px;margin:12px 0;flex-wrap:wrap}
button{border:0;border-radius:8px;padding:13px 18px;color:white;font-weight:800;font-size:15px}
#start{background:#0875dc}
#stop{background:#e92843}
button:disabled{opacity:.55}
#reader{width:100%;min-height:120px;background:#071b33;border-radius:10px;overflow:hidden}
#reader video{object-fit:cover}
#result{margin-top:12px;padding:13px;border-radius:9px;background:#eef5ff;border:1px solid #c7d9ef;white-space:pre-line;line-height:1.6;font-weight:800;min-height:65px}
.success{background:#e8fff3!important;color:#087849;border-color:#a9e6c7!important}
.duplicate{background:#fff8e7!important;color:#855900;border-color:#f1d58a!important}
.error{background:#fff0f2!important;color:#c7193b;border-color:#f2b8c2!important}
.small{font-size:12px;color:#456;margin-top:10px}
footer{text-align:center;color:#fff;background:#07509a;border-radius:7px;padding:9px;margin-top:12px;font-size:12px}
</style>
</head>
<body>

<header>
<strong>Shri Swaminarayan Mandir - Golden City</strong>
<span>Satsang Sabha Volunteer QR Scanner</span>
</header>

<main>
<section class="panel">



<div class="actions">
<button id="start" type="button">Start Camera</button>
<button id="stop" type="button" disabled>Stop Camera</button>
</div>

<div id="reader"></div>

<div id="result">
Camera is stopped. Press Start Camera and allow camera permission.
</div>

<div class="small" id="count">
New attendance scans this session: 0
</div>


</section>

<footer>
|| શ્રી સ્વામિનારાયણ ભગવાનની જય || &nbsp; | &nbsp; SSM ATTND | Golden City
</footer>
</main>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<script>
'use strict';

// Google Apps Script web-app URL.
const APPS_SCRIPT_URL =
'https://script.google.com/macros/s/AKfycbx-tkq1P1sJmhg218VhFFr9_UI0HJbxYFvpz0vCyXQMrygwmKJ7GvUcN6DBnTiOAMUc/exec';
let qrScanner = null;
let busy = false;
let lastId = '';
let lastAt = 0;
let totalNew = 0;

// Audio context for attendance confirmation beep.
let attendanceAudio = null;

const resultBox = document.getElementById('result');
const startButton = document.getElementById('start');
const stopButton = document.getElementById('stop');

function showResult(message, type) {
  resultBox.className = type || '';
  resultBox.textContent = message;
}

// Prepare audio after the volunteer presses Start Camera.
// This helps Android Chrome allow the confirmation sound.
async function prepareAttendanceSound() {
  try {
    const AudioContextClass =
      window.AudioContext || window.webkitAudioContext;

    if (!AudioContextClass) return;

    if (!attendanceAudio) {
      attendanceAudio = new AudioContextClass();
    }

    if (attendanceAudio.state === 'suspended') {
      await attendanceAudio.resume();
    }
  } catch (e) {
    console.warn('Audio preparation:', e);
  }
}

// Play one short beep only after new attendance is recorded.
function playAttendanceSound() {
  try {
    if (!attendanceAudio ||
        attendanceAudio.state !== 'running') {
      return;
    }

    const oscillator = attendanceAudio.createOscillator();
    const gain = attendanceAudio.createGain();

    oscillator.connect(gain);
    gain.connect(attendanceAudio.destination);

    oscillator.type = 'sine';
    oscillator.frequency.setValueAtTime(
      880, attendanceAudio.currentTime
    );

    gain.gain.setValueAtTime(
      0.001, attendanceAudio.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      0.18, attendanceAudio.currentTime + 0.015
    );

    gain.gain.exponentialRampToValueAtTime(
      0.001, attendanceAudio.currentTime + 0.20
    );

    oscillator.start(attendanceAudio.currentTime);
    oscillator.stop(attendanceAudio.currentTime + 0.21);

  } catch (e) {
    console.warn('Attendance beep:', e);
  }
}

function extractMemberId(decodedText) {
  const raw = String(decodedText || '').trim();

  if (!raw) return '';

  try {
    const parsed = new URL(raw);
    const id = parsed.searchParams.get('id');

    if (id) return id.trim();

  } catch (e) {}

  const match = raw.match(/[?&]id=([^&#]+)/i);

  if (match) {
    try {
      return decodeURIComponent(
        match[1].replace(/\+/g, '%20')
      ).trim();
    } catch (e) {
      return match[1].trim();
    }
  }

  return /^[A-Za-z0-9_-]{1,50}$/.test(raw) ? raw : '';
}

// JSONP connection to Google Apps Script.
function callAppsScript(params) {
  return new Promise((resolve, reject) => {

    const callbackName =
      'ssmJsonp_' + Date.now() + '_' +
      Math.floor(Math.random() * 1000000);

    const script = document.createElement('script');
    const query = new URLSearchParams(params);

    query.set('callback', callbackName);
    query.set('_', String(Date.now()));

    let finished = false;

    const cleanup = () => {
      if (finished) return;

      finished = true;
      delete window[callbackName];

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }
    };

    const timeout = window.setTimeout(() => {
      cleanup();

      reject(new Error(
        'The attendance server did not respond. Check your internet connection and try again.'
      ));
    }, 25000);

    window[callbackName] = data => {
      window.clearTimeout(timeout);
      cleanup();
      resolve(data);
    };

    script.onerror = () => {
      window.clearTimeout(timeout);
      cleanup();

      reject(new Error(
        'Could not connect to Google Apps Script. Check the deployment URL and internet connection.'
      ));
    };

    script.src =
      APPS_SCRIPT_URL + '?' + query.toString();

    document.head.appendChild(script);
  });
}

async function handleDecoded(text) {

  const memberId = extractMemberId(text);

  if (!memberId) {
    showResult(
      'This QR code does not contain a recognised member ID. Scan a member personal QR code.',
      'error'
    );
    return;
  }

  const now = Date.now();

  if (
    busy ||
    (memberId.toLowerCase() === lastId &&
     now - lastAt < 2200)
  ) {
    return;
  }

  busy = true;
  lastId = memberId.toLowerCase();
  lastAt = now;

  showResult('Checking member ' + memberId + '…', '');

  try {

    const data = await callAppsScript({
      api: 'scan',
      memberId: memberId
    });

    if (data && data.success) {

      const when =
        (data.date || '') +
        (data.time ? '  ' + data.time : '');

      if (data.duplicate) {

        showResult(
          'ALREADY RECORDED\n' +
          (data.name || memberId) +
          '\n' + when,
          'duplicate'
        );

      } else {

        totalNew++;

        document.getElementById('count').textContent =
          'New attendance scans this session: ' + totalNew;

        showResult(
          'ATTENDANCE RECORDED ✓\n' +
          (data.name || memberId) +
          '\n' + when,
          'success'
        );

        // Confirmation beep for newly recorded attendance.
        playAttendanceSound();

        // Rebuild report sheets after attendance confirmation.
        callAppsScript({api:'sync'})
          .catch(err => console.warn('Report sync:', err));
      }

    } else {

      showResult(
        (data && data.message) ||
        'Attendance could not be recorded.',
        'error'
      );
    }

  } catch (err) {

    showResult(
      err.message || String(err),
      'error'
    );

  } finally {

    busy = false;
  }
}

async function startCamera() {

  if (qrScanner && qrScanner.isScanning) return;

  if (!window.Html5Qrcode) {
    showResult(
      'QR scanner library did not load. Check your internet connection and reload this page.',
      'error'
    );
    return;
  }

  startButton.disabled = true;

  showResult('Opening rear camera…', '');

  try {

    // Enable audio using the Start Camera button interaction.
    await prepareAttendanceSound();

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {
      throw new Error(
        'Camera access requires an HTTPS website. Open this scanner using its GitHub Pages https:// address.'
      );
    }

    if (!qrScanner) {
      qrScanner = new Html5Qrcode(
        'reader',
        {verbose:false}
      );
    }

    await qrScanner.start(

      {facingMode:'environment'},

      {
        fps:12,

        qrbox:(w,h) => {
          const size = Math.max(
            180,
            Math.min(
              320,
              Math.floor(Math.min(w,h)*0.72)
            )
          );

          return {
            width:size,
            height:size
          };
        },

        aspectRatio:1.0,
        rememberLastUsedCamera:true
      },

      handleDecoded,

      () => {}
    );

    showResult(
      'Camera is ready. Show one member QR code at a time.',
      'success'
    );

    stopButton.disabled = false;

  } catch (err) {

    const message =
      err && err.name === 'NotAllowedError'
      ? 'Camera permission was denied by the browser. Open the GitHub Pages scanner in Chrome, tap the site icon → Permissions → Camera → Allow, then reload.'
      : ((err && err.message) || String(err));

    showResult(message, 'error');

  } finally {

    startButton.disabled = false;
  }
}

async function stopCamera() {

  if (qrScanner && qrScanner.isScanning) {

    try {
      await qrScanner.stop();
      await qrScanner.clear();

    } catch (err) {

      showResult(
        'Unable to stop camera: ' +
        (err.message || err),
        'error'
      );
    }
  }

  stopButton.disabled = true;

  showResult(
    'Camera is stopped. Press Start Camera when ready.',
    ''
  );
}

startButton.addEventListener('click', startCamera);
stopButton.addEventListener('click', stopCamera);

window.addEventListener('pagehide', () => {

  if (qrScanner && qrScanner.isScanning) {
    qrScanner.stop().catch(() => {});
  }

  if (attendanceAudio) {
    attendanceAudio.close().catch(() => {});
  }
});

</script>
</body>
</html>
