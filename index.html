
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shri Swaminarayan Mandir - Golden City</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
*{box-sizing:border-box}

html,body{
 margin:0;
 padding:0;
 width:100%;
 min-height:100%;
 font-family:Arial,sans-serif;
 background:#f5f7f5;
 text-align:center;
}

body{
 padding:10px;
}

header{
 padding:8px 4px 12px;
}

h2{
 color:#176b43;
 font-size:25px;
 margin:4px 0;
 line-height:1.2;
}

h4{
 color:#176b43;
 font-size:16px;
 font-weight:normal;
 margin:3px 0 10px;
}

h3{
 color:#333;
 font-size:19px;
 margin:8px 0 12px;
}

#reader{
 width:100%;
 max-width:600px;
 margin:8px auto 12px;
 background:white;
 border-radius:10px;
 overflow:hidden;
}

.controls{
 display:flex;
 width:100%;
 max-width:600px;
 gap:10px;
 margin:10px auto;
}

button{
 flex:1;
 min-width:0;
 padding:15px 5px;
 border:0;
 border-radius:8px;
 color:white;
 font-size:17px;
 font-weight:bold;
 cursor:pointer;
}

#start{background:#087b45}
#stop{background:#b3261e}

#status{
 width:100%;
 max-width:600px;
 min-height:120px;
 margin:12px auto;
 padding:20px 12px;
 border-radius:10px;
 background:white;
 color:#222;
 font-size:21px;
 font-weight:bold;
 line-height:1.6;
 white-space:pre-line;
 overflow-wrap:anywhere;
 box-shadow:0 2px 7px rgba(0,0,0,.08);
}

@media(max-width:480px){
 body{padding:7px}
 h2{font-size:23px}
 h4{font-size:15px}
 h3{font-size:18px}
 button{font-size:16px;padding:15px 3px}
 #status{font-size:21px;padding:18px 8px}
 #reader{max-width:100%}
}
</style>
</head>

<body>

<header>
<h2>Shri Swaminarayan Mandir</h2>
<h4>Golden City</h4>
<h3>Sabha Attendance QR Scanner</h3>
</header>

<div id="reader"></div>

<div class="controls">
<button id="start">Start Camera</button>
<button id="stop">Stop Camera</button>
</div>

<div id="status">Ready to scan</div>

<script>
const API="https://script.google.com/macros/s/AKfycbx-tkq1P1sJmhg218VhFFr9_UI0HJbxYFvpz0vCyXQMrygwmKJ7GvUcN6DBnTiOAMUc/exec";

let scanner=null;
let busy=false;
let lastId="";
let lastTime=0;

function show(message){
 document.getElementById("status").textContent=message;
}

function getMemberId(text){
 try{
  const u=new URL(text);
  return u.searchParams.get("id")||"";
 }catch(e){
  return text.trim();
 }
}

function callAttendanceAPI(memberId){
 return new Promise((resolve,reject)=>{
  const callback="ssmCallback"+Date.now()+"_"+Math.floor(Math.random()*100000);
  const script=document.createElement("script");
  let finished=false;

  const cleanup=()=>{
   finished=true;
   delete window[callback];
   script.remove();
   clearTimeout(timer);
  };

  const timer=setTimeout(()=>{
   if(!finished){
    cleanup();
    reject(new Error("Connection timed out. Check internet or Apps Script deployment."));
   }
  },20000);

  window[callback]=(result)=>{
   if(finished)return;
   cleanup();
   resolve(result);
  };

  script.onerror=()=>{
   if(!finished){
    cleanup();
    reject(new Error("Could not connect to Google Sheets."));
   }
  };

  script.src=API+
   "?api=scan"+
   "&memberId="+encodeURIComponent(memberId)+
   "&callback="+encodeURIComponent(callback)+
   "&_="+Date.now();

  document.body.appendChild(script);
 });
}

async function onScan(decodedText){
 if(busy)return;

 const memberId=getMemberId(decodedText);

 if(!memberId || !/^[a-zA-Z0-9_-]+$/.test(memberId)){
  show("Invalid member QR code.");
  return;
 }

 const now=Date.now();
 if(memberId===lastId && now-lastTime<5000)return;

 lastId=memberId;
 lastTime=now;
 busy=true;

 show("Recording attendance...");

 try{
  const result=await callAttendanceAPI(memberId);

  if(result && result.success){
   const name=result.name||result.memberName||"Member";
   const date=result.date||"";
   const time=result.time||"";

   show(
    (result.duplicate?"Already recorded":"ATTENDANCE MARKED!")+
    "\n\n"+name+
    "\n\nDate: "+date+
    "\nTime: "+time
   );
  }else{
   show("Attendance not recorded:\n"+
    (result && result.message ? result.message:"Unknown response"));
  }
 }catch(error){
  show("ERROR:\n"+error.message);
 }finally{
  busy=false;
 }
}

async function startCamera(){
 try{
  if(!window.isSecureContext || !navigator.mediaDevices){
   show("Please open this scanner using its HTTPS GitHub Pages address.");
   return;
  }

  if(!scanner)scanner=new Html5Qrcode("reader");

  show("Opening rear camera...");

  const cameras=await Html5Qrcode.getCameras();

  if(!cameras.length){
   show("No camera found.");
   return;
  }

  const rear=cameras.find(c=>/back|rear|environment/i.test(c.label));
  const cameraId=rear?rear.id:cameras[cameras.length-1].id;

  await scanner.start(
   cameraId,
   {
    fps:15,
    qrbox:(width,height)=>{
     const size=Math.floor(Math.min(width,height,300)*0.85);
     return {width:size,height:size};
    },
    aspectRatio:1.0
   },
   onScan,
   ()=>{}
  );

  show("Camera ready. Scan a member QR code.");
 }catch(error){
  show("Camera error: "+error.message);
 }
}

async function stopCamera(){
 try{
  if(scanner && scanner.isScanning){
   await scanner.stop();
   show("Camera stopped.");
  }
 }catch(error){
  show("Camera stop error: "+error.message);
 }
}

document.getElementById("start").onclick=startCamera;
document.getElementById("stop").onclick=stopCamera;
</script>

</body>
</html>
